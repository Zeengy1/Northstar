const dateISO=d=>{const y=d.getFullYear();return `${y}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const addDays=n=>{const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+n);return dateISO(d)};
const fmtDate=s=>{if(!s)return 'No deadline';const d=new Date(s+'T12:00:00');return Number.isNaN(d.getTime())?'No deadline':d.toLocaleDateString('en-NG',{day:'numeric',month:'short'})};
const isDate=s=>!s||/^\d{4}-\d{2}-\d{2}$/.test(s)&&!Number.isNaN(new Date(s+'T12:00:00').getTime());
const clamp=(n,a,b)=>Math.max(a,Math.min(b,Number(n)||0));
const state={view:'today',tasks:[],operations:[],ready:false,db:null,voice:null};
function scores(title,deadline,goal){
 const s=String(title).toLowerCase(); let urgency=1, importance=1;
 if(deadline){const now=new Date(addDays(0)+'T12:00:00');const due=new Date(deadline+'T12:00:00');const delta=Math.round((due-now)/86400000);urgency=delta<=0?4:delta<=2?3:delta<=7?2:1;}
 if(/\b(urgent|asap|immediately|today|overdue)\b/.test(s))urgency=4;
 if(/\b(client|customer|launch|deadline|presentation|critical|interview|invoice|payment|health|deliver)\b/.test(s))importance=3;
 if(goal&&goal!=='No goal')importance=Math.min(4,importance+1);
 return {urgency,importance};
}
function quadrant(t){if(t.urgency>=3&&t.importance>=3)return 'do';if(t.urgency<3&&t.importance>=3)return 'schedule';if(t.urgency>=3&&t.importance<3)return 'delegate';return 'eliminate';}
const qlabels={do:'Do first',schedule:'Schedule',delegate:'Delegate / reduce',eliminate:'Defer / eliminate'};
const qhints={do:'Urgent + important',schedule:'Important, not urgent',delegate:'Urgent, less important',eliminate:'Neither urgent nor important'};
function openDb(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB_NAME,DB_VERSION);r.onupgradeneeded=()=>{const db=r.result;db.createObjectStore('tasks',{keyPath:'id'});db.createObjectStore('operations',{keyPath:'operationId'});db.createObjectStore('meta',{keyPath:'key'});};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});}
function txDone(tx){return new Promise((resolve,reject)=>{tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error||new Error('Database transaction failed'));tx.onabort=()=>reject(tx.error||new Error('Database transaction aborted'));});}
async function list(store){const tx=state.db.transaction([store],'readonly');const r=tx.objectStore(store).getAll();const result=await new Promise((resolve,reject)=>{r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});await txDone(tx);return result;}
async function refresh(){state.tasks=(await list('tasks')).sort((a,b)=>b.updatedAt.localeCompare(a.updatedAt));state.operations=(await list('operations')).sort((a,b)=>b.createdAt.localeCompare(a.createdAt));render();}
async function commitTask(incoming,kind='update',expectedRevision){
 const tx=state.db.transaction(['tasks','operations'],'readwrite');const tasks=tx.objectStore('tasks'),outbox=tx.objectStore('operations');
 const done=txDone(tx);const existing=await new Promise((resolve,reject)=>{const r=tasks.get(incoming.id);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});
 const base=existing?.revision||0;
 if(expectedRevision!==undefined&&base!==expectedRevision){tx.abort();await done.catch(()=>{});throw new Error('Revision conflict. Reload the task and try again.');}
 const next={...incoming,revision:base+1,updatedAt:new Date().toISOString()};
 tasks.put(next);
 outbox.put({operationId:uuid(),entityId:next.id,entityType:'task',kind,baseRevision:base,newRevision:next.revision,createdAt:new Date().toISOString(),status:'pending',attempts:0,nextAttemptAt:null,payload:next});
 await done;await refresh();return next;
}
async function seed(){
 const existing=await list('tasks');if(existing.length)return;
 const samples=[
  ['Prepare launch checklist',addDays(0),'Launch my product',4,4,true,false],
  ['Send proposal to prospective client',addDays(1),'Work responsibilities',3,4,true,false],
  ['Study task automation basics',addDays(7),'Grow my skills',2,4,true,false],
  ['Plan next week’s learning schedule',addDays(6),'Grow my skills',2,3,true,false],
  ['Respond to routine status request',addDays(0),'Work responsibilities',4,1,true,false],
  ['Organize old bookmarks','', 'No goal',1,1,true,false],
  ['Draft idea for a new side project','', 'Launch my product',1,2,false,false],
  ['Review personal budget',addDays(2),'Personal wellbeing',3,3,true,true]
 ];
 const tx=state.db.transaction(['tasks','meta'],'readwrite');const st=tx.objectStore('tasks');const stamp=new Date().toISOString();
 samples.forEach(([title,dueDate,goal,urgency,importance,approved,done],index)=>st.put({id:uuid(),title,notes:'',goal,dueDate,dueTime:'09:00',duration:30,urgency,importance,approved,done,deleted:false,calendarStatus:'not-created',calendarConfirmedAt:null,revision:1,createdAt:stamp,updatedAt:new Date(Date.now()-index*1000).toISOString()}));
 tx.objectStore('meta').put({key:'seeded',value:true});await txDone(tx);
}

async function patchTask(id,changes,kind){const old=taskById(id);if(!old)return;await commitTask({...old,...changes},kind,old.revision);}
function shareModal(id){const t=taskById(id);if(!t)return;const shareText=`${t.title}\nDue: ${t.dueDate?fmtDate(t.dueDate):'Unscheduled'}\nGoal: ${t.goal}\nStatus: ${t.done?'Completed':'Open'}`;modal('Review before sharing',`<div class="callout"><strong>Sharing disclosure</strong><br>You are sending information outside this app. Your recipient and the chosen messaging service may retain or forward it. Avoid sharing another person's private information without permission.</div><div class="share-preview" id="share-content">${safe(shareText)}</div><label class="checkbox-row"><input type="checkbox" id="share-agree"/><span>I reviewed this information and understand it may be visible to the recipient. <button class="text-btn" data-act="terms" type="button">Terms of Use</button></span></label>`,`${btn('Cancel','close-modal')}${btn('Share reviewed text ↗','complete-share','primary',`data-id="${id}"`)}`);}
async function performShare(id){const check=$('#share-agree');if(!check?.checked){showToast('Please review and acknowledge the sharing disclosure.');return;}const t=taskById(id);if(!t)return;const text=`${t.title}\nDue: ${t.dueDate?fmtDate(t.dueDate):'Unscheduled'}\nGoal: ${t.goal}\nStatus: ${t.done?'Completed':'Open'}`;showToast('Sharing outside the app. Confirm the recipient in your chosen app.');try{if(navigator.share)await navigator.share({title:'Task summary',text});else if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(text);showToast('Copied for sharing. Confirm recipients before sending.');}else showToast('Sharing unsupported here. Copy the text from the preview.');closeModal();}catch(e){if(e.name!=='AbortError')showToast('Sharing not completed.');}}
function calendarModal(id){const t=taskById(id);if(!t)return;modal('Create a calendar event',`<div class="callout"><strong>Manual calendar confirmation</strong><br>An event link only opens a prefilled form. We cannot tell if you actually saved the event. Report the outcome below; it will be stored as your confirmation, not calendar synchronization.</div><div class="share-preview">${safe(t.title)}<br>Event date: ${safe(t.dueDate?fmtDate(t.dueDate):'Not set')}<br>Start: ${safe(t.dueTime||'09:00')} · ${Number(t.duration)||30} minutes<br>Previous status: ${safe(t.calendarStatus||'not-created')}</div><div class="row" style="flex-wrap:wrap">${btn('Open Google Calendar ↗','open-calendar','primary',`data-id="${id}" ${t.dueDate?'':'disabled'}`)}${btn('Download .ics','download-ics','',`data-id="${id}" ${t.dueDate?'':'disabled'}`)}</div><label class="checkbox-row" style="margin-top:14px"><input type="checkbox" id="calendar-include-title"/><span>Include the task title in the Google Calendar link. If selected, the title is shared with Google through the URL. By default, the link uses the generic name <strong>Focus session</strong>.</span></label><p class="smallprint">Uses your browser to open an external form. No calendar API access or readback.</p><hr class="divider"/><label class="label" for="calendar-result">What happened?</label><select id="calendar-result" class="field"><option value="not-created">Not saved yet</option><option value="user-confirmed">I saved this event</option><option value="changed">I changed the date/time outside the app</option><option value="cancelled">I cancelled</option></select><p class="smallprint">If the details changed, edit the task to match before confirming.</p>`,`${btn('Close','close-modal')}${btn('Record confirmation','calendar-confirm','primary',`data-id="${id}"`)}`);}
function calendarDates(t){if(!t.dueDate)return null;const start=new Date(`${t.dueDate}T${t.dueTime||'09:00'}:00`);if(Number.isNaN(start.getTime()))return null;const end=new Date(start.getTime()+clamp(t.duration||30,5,480)*60000);const format=d=>d.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}Z/,'Z');return {start:format(start),end:format(end)};}
function calUrl(t,includeTitle=false){const times=calendarDates(t);if(!times)return null;const p=new URLSearchParams({action:'TEMPLATE',text:includeTitle?t.title:'Focus session',dates:`${times.start}/${times.end}`,details:'Created from a manually confirmed task-planning prototype. Please review details before saving.'});return 'https://calendar.google.com/calendar/render?'+p.toString();}
function downloadFile(name,text,type='application/json'){const blob=new Blob([text],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function icsDownload(t){const dates=calendarDates(t);if(!dates)return;const enc=s=>String(s).replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;');const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Northstar Offline Prototype//EN','BEGIN:VEVENT',`UID:${t.id}@local-demo.invalid`,`DTSTAMP:${new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}Z/,'Z')}`,`DTSTART:${dates.start}`,`DTEND:${dates.end}`,`SUMMARY:${enc(t.title)}`,'DESCRIPTION:User-created calendar entry; not automatically synchronized.','END:VEVENT','END:VCALENDAR'];downloadFile('task-event.ics',lines.join('\r\n')+'\r\n','text/calendar');}
async function exportBackup(){const backup={schema:'northstar.local.demo.v1',exportedAt:new Date().toISOString(),warning:'Local demo sample data only; unencrypted export. Do not treat as a secure off-device production backup.',tasks:await list('tasks'),operations:await list('operations')};downloadFile(`northstar-demo-${addDays(0)}.json`,JSON.stringify(backup,null,2));showToast('Local JSON export created. This is not scheduled or encrypted backup.');}
async function reset(){if(!confirm('Delete all local demo tasks and queued operations? This cannot be undone unless you have an exported copy.'))return;const tx=state.db.transaction(['tasks','operations','meta'],'readwrite');tx.objectStore('tasks').clear();tx.objectStore('operations').clear();tx.objectStore('meta').clear();await txDone(tx);await seed();await refresh();showToast('Demo reset to sample tasks.');}
async function voice(){if(!confirm('Browser voice recognition may send your audio to the browser provider. For this prototype, use sample speech only and no sensitive information. Continue?'))return;const SpeechRecognition=globalThis.SpeechRecognition||globalThis.webkitSpeechRecognition;if(!SpeechRecognition){showToast('This browser does not support built-in voice recognition. Use text capture.');return;}const r=new SpeechRecognition();r.lang='en-NG';r.continuous=false;r.interimResults=false;r.onresult=e=>{const txt=Array.from(e.results).map(x=>x[0].transcript).join(' ');const area=$('#brain-dump');if(area){area.value+=(area.value.trim()?'\n':'')+txt;showToast('Transcript added. Review wording before creating tasks.');}};r.onerror=()=>showToast('Speech recognition unavailable. You can type instead.');r.onend=()=>{state.voice=null};state.voice=r;r.start();showToast('Listening for English speech…');}
function terms(){modal('Sharing terms — demo notice',`<p class="smallprint">You are responsible for reviewing the content and recipients of messages you choose to share. Recipient apps may store or forward shared information. The app does not send WhatsApp or email messages automatically. This preview is not the final legally reviewed Terms of Use.</p>`,btn('Close','close-modal'));}
async function handleClick(e){const el=e.target.closest('[data-act],[data-view]');if(!el)return;const v=el.dataset.view;if(v){state.view=v;render();document.querySelector('.sidebar').classList.remove('open');scrollTo({top:0,behavior:'smooth'});return;}
 const act=el.dataset.act,id=el.dataset.id;try{
  if(act==='new')editTask();
  else if(act==='edit')editTask(id);
  else if(act==='close-modal')closeModal();
  else if(act==='toggle'){const t=taskById(id);if(t)await patchTask(id,{done:!t.done},'complete');}
  else if(act==='approve')await patchTask(id,{approved:true},'approve');
  else if(act==='approve-all'){for(const t of allTasks().filter(t=>!t.approved&&!t.done))await patchTask(t.id,{approved:true},'approve');showToast('Matrix approved. All suggestions remain editable.');}
  else if(act==='delete'){if(!confirm('Delete this task? It will leave a local tombstone for future synchronization.'))return;await patchTask(id,{deleted:true},'delete');closeModal();showToast('Task deleted locally; tombstone retained.');}
  else if(act==='suggest-scores'){const s=scores($('#task-title').value,$('#task-date').value,$('#task-goal').value);$('#task-urgency').value=s.urgency;$('#task-importance').value=s.importance;showToast('Suggested scores updated. You can override them.');}
  else if(act==='nav-matrix'){state.view='matrix';render();}
  else if(act==='sample-text'){$('#brain-dump').value='Prepare the launch presentation by tomorrow\nStudy 30 minutes of system design\nOrganize my notes this week\nReply to a routine update today';}
  else if(act==='parse-brain'){const area=$('#brain-dump');const lines=area.value.split(/\n+/).map(s=>s.trim()).filter(Boolean).slice(0,30);if(!lines.length){showToast('Enter at least one task.');return;}for(const title of lines){const dueDate=/\btomorrow\b/i.test(title)?addDays(1):/\btoday\b/i.test(title)?addDays(0):/\bthis week\b/i.test(title)?addDays(6):'';const goal=/\b(launch|product)\b/i.test(title)?'Launch my product':/\b(study|learn|course)\b/i.test(title)?'Grow my skills':'No goal';const s=scores(title,dueDate,goal);await commitTask({id:uuid(),title:title.slice(0,240),notes:'',goal,dueDate,dueTime:'09:00',duration:30,urgency:s.urgency,importance:s.importance,approved:false,done:false,deleted:false,calendarStatus:'not-created',calendarConfirmedAt:null,createdAt:new Date().toISOString()},'create',0);}state.view='matrix';await refresh();showToast(`${lines.length} task${lines.length===1?'':'s'} captured locally. Review the matrix.`);}
  else if(act==='voice')await voice();
  else if(act==='share')shareModal(id);
  else if(act==='complete-share')await performShare(id);
  else if(act==='terms')terms();
  else if(act==='calendar')calendarModal(id);
  else if(act==='open-calendar'){const url=calUrl(taskById(id),!!$('#calendar-include-title')?.checked);if(url){const w=window.open(url,'_blank','noopener,noreferrer');if(!w)showToast('Popup blocked. Allow popups or download the .ics file.');}else showToast('Add a task date before creating an event.');}
  else if(act==='download-ics')icsDownload(taskById(id));
  else if(act==='calendar-confirm'){const value=$('#calendar-result').value;await patchTask(id,{calendarStatus:value,calendarConfirmedAt:value==='user-confirmed'?new Date().toISOString():null},'calendar-confirm');closeModal();showToast(value==='user-confirmed'?'Recorded as user-confirmed, not synchronized.':'Calendar outcome saved locally.');}
  else if(act==='export')await exportBackup();
  else if(act==='reset')await reset();
 }catch(err){console.error('Action failed',err);showToast('Unable to complete action: '+(err?.message||'Unknown error'));}}
async function init(){ $('#today-date').textContent=new Date().toLocaleDateString('en-NG',{weekday:'short',month:'short',day:'numeric'});$('#menu-btn').addEventListener('click',()=>document.querySelector('.sidebar').classList.toggle('open'));document.addEventListener('click',handleClick);document.addEventListener('submit',async e=>{if(e.target.id!=='task-form')return;e.preventDefault();try{await handleTaskForm(e.target)}catch(err){console.error(err);showToast('Could not save: '+err.message)}});$('#connectivity').textContent=navigator.onLine?'● Offline-ready':'● Offline';addEventListener('online',()=>$('#connectivity').textContent='● Offline-ready');addEventListener('offline',()=>$('#connectivity').textContent='● Offline');try{state.db=await openDb();await seed();state.ready=true;await refresh();}catch(err){console.error(err);$('#content').innerHTML='<div class="display-warning"><strong>Local database unavailable.</strong><br>This prototype requires IndexedDB. Try a normal modern browser (not private mode) or run it using a local server. No changes have been stored.</div>';showToast('IndexedDB is not available in this browser context.');}
 if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
}
init();
})();

</script>
